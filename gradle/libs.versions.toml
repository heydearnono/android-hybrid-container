[versions]
# 三者互相咬死，改一个要一起验：AGP 9.2.1 / Gradle 9.4.1 / AGP 内置 Kotlin 2.2.10
# 内置 Kotlin 版本读自 gradle-9.2.1.pom 的 kotlin-gradle-plugin 依赖，compose 编译器插件必须等于它
agp = "9.2.1"
kotlin = "2.2.10"

# SDK 档位取 pro 的取值表：minSdk = 37（三端一律取各自最新正式档）
# 本机只装了 android-36.1 与 android-37.0，没有 android-37，所以 compileSdk 必须带 minorApiLevel
compileSdk = "37"
compileSdkMinor = "0"
minSdk = "37"
targetSdk = "37"

# 应用版本：UA 拼成 <系统 UA> Crab/0.1.0，三端同一次发布同一个字符串
versionName = "0.1.0"

androidxCore = "1.19.0"
androidxActivity = "1.13.0"
androidxWebkit = "1.17.0"
composeBom = "2026.08.00"

junit = "4.13.2"

spotless = "8.10.1"
ktlint = "1.8.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

junit4 = { module = "junit:junit", version.ref = "junit" }
# 坐标必须是 kotlin-test-junit，不能是聚合坐标 kotlin-test：
# 后者靠 Gradle variant 属性选测试框架，而 AGP 内置 Kotlin 不设这个属性，会解析到拿不到 kotlin.test.Test 的变体
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

# build-logic 用 compileOnly 编译，运行期由根工程的 apply false 插件提供
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
