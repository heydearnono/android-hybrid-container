<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hybrid 容器自检</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 16px 16px 32px;
    font: 15px/1.5 -apple-system, "PingFang SC", sans-serif;
  }
  h1 { font-size: 19px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 20px 0 8px; opacity: .6; font-weight: 600; }
  #status { margin: 0; font-size: 13px; }
  #status.bad { color: #c62828; font-weight: 600; }
  button {
    display: block; width: 100%; margin: 6px 0; padding: 11px 12px;
    font: inherit; text-align: left;
    border: 1px solid rgba(128, 128, 128, .4); border-radius: 8px;
    background: transparent; color: inherit;
  }
  button:active { background: rgba(128, 128, 128, .2); }
  #log {
    margin: 20px 0 0; padding: 10px; min-height: 120px;
    font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all;
    border: 1px solid rgba(128, 128, 128, .4); border-radius: 8px;
  }
</style>
</head>
<body>

<h1>Hybrid 容器自检</h1>
<p id="status">检测中…</p>

<h2>设备与应用信息</h2>
<button data-method="device.info">device.info</button>

<h2>UI 反馈</h2>
<button data-method="ui.toast" data-params='{"text":"来自 JS 的 toast"}'>ui.toast（短）</button>
<button data-method="ui.toast" data-params='{"text":"长 toast","long":true}'>ui.toast（长）</button>
<button data-method="ui.toast" data-params='{}'>ui.toast 不带 text → 应 INVALID_PARAMS</button>

<h2>页面与导航</h2>
<button id="btn-title">page.setTitle（每次都不同）</button>
<button data-method="router.open" data-params='{"route":"articles"}'>router.open('articles') → 原生列表页</button>
<button data-method="router.open" data-params='{"route":"nope"}'>router.open('nope') → 应 NOT_FOUND</button>
<button data-method="page.close">page.close（栈底时会退出 App）</button>

<h2>本地存储</h2>
<button id="btn-set">storage.set</button>
<button data-method="storage.get" data-params='{"key":"demo.stamp"}'>storage.get</button>
<button data-method="storage.remove" data-params='{"key":"demo.stamp"}'>storage.remove</button>

<h2>访问控制自检</h2>
<button data-method="storage.clear" data-params='{}'>调白名单外的能力 → 应 PERMISSION_DENIED</button>

<pre id="log"></pre>

<script src="bridge.js"></script>
<script>
(function () {
  'use strict';

  var logEl = document.getElementById('log');
  var statusEl = document.getElementById('status');

  function stamp() {
    return new Date().toTimeString().slice(0, 8);
  }

  function log(line) {
    logEl.textContent = stamp() + '  ' + line + '\n' + logEl.textContent;
  }

  /** 结果直接打在页面上：这个页面是唯一能看见 bridge 是否真的通了的地方。 */
  function invoke(method, params) {
    log('→ ' + method + ' ' + JSON.stringify(params || {}));
    HybridBridge.call(method, params).then(
      function (data) { log('← ok    ' + method + ' ' + JSON.stringify(data)); },
      function (err) { log('← fail  ' + method + ' [' + err.code + '] ' + err.message); }
    );
  }

  Array.prototype.forEach.call(document.querySelectorAll('button[data-method]'), function (btn) {
    btn.addEventListener('click', function () {
      invoke(btn.getAttribute('data-method'), JSON.parse(btn.getAttribute('data-params') || '{}'));
    });
  });

  var titleSeq = 0;
  document.getElementById('btn-title').addEventListener('click', function () {
    titleSeq += 1;
    invoke('page.setTitle', { title: 'JS 设的标题 #' + titleSeq });
  });

  document.getElementById('btn-set').addEventListener('click', function () {
    // 存当前时间：storage.get 读回来的值能不能对上，一眼就看得出来。
    invoke('storage.set', { key: 'demo.stamp', value: stamp() });
  });

  // native → JS 的事件。收不到 page.resume 说明事件通道没建立，
  // 而不是页面没显示——注意首次 resume 早于握手，会被丢掉，属预期。
  HybridBridge.on('page.resume', function () { log('★ event page.resume'); });
  HybridBridge.on('page.pause', function () { log('★ event page.pause'); });

  if (HybridBridge.available) {
    statusEl.textContent = '等待握手…';
    HybridBridge.ready.then(
      function () {
        statusEl.textContent = 'bridge 已握手，共 ' + HybridBridge.methods.length + ' 个可用能力，逐个按钮验证。';
      },
      function (err) {
        statusEl.textContent = '握手失败：[' + err.code + '] ' + err.message;
        statusEl.className = 'bad';
      }
    );
  } else {
    statusEl.textContent = 'bridge 未注入：这个页面不在浏览器里跑，只能在容器里打开。';
    statusEl.className = 'bad';
  }
})();
</script>

</body>
</html>
