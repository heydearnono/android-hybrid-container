<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Crab 探针</title>
    <!--CRAB-INJECT-->
    <script>
      // 记住页面开口时注入的快照：inject-order 靠它判「页面自己的脚本跑之前 __CRAB__ 已经在了」。
      // 这段必须在标记之后、在 probe.js 之前，否则判的是自己而不是注入。
      window.__CRAB_SNAPSHOT__ = typeof window.__CRAB__ !== 'undefined'
        ? { origin: window.__CRAB__.origin, injected: window.__CRAB__.injected }
        : null;
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 16px;
        font: 15px/1.5 -apple-system, "Helvetica Neue", sans-serif;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 14px;
        margin: 16px 0 6px;
      }
      p.hint {
        margin: 0 0 12px;
        opacity: 0.7;
        font-size: 13px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      td {
        padding: 4px 6px;
        border-bottom: 1px solid rgba(128, 128, 128, 0.3);
        vertical-align: top;
      }
      td.slug {
        white-space: nowrap;
        font-family: ui-monospace, monospace;
      }
      td.verdict {
        width: 4em;
        font-weight: 700;
      }
      td.detail {
        font-size: 12px;
        opacity: 0.75;
        word-break: break-all;
      }
      .PASS {
        color: #128a2b;
      }
      .FAIL {
        color: #c1121f;
      }
      #env {
        margin-top: 12px;
        font-size: 12px;
        opacity: 0.75;
        word-break: break-all;
      }
      img#subresource {
        width: 24px;
        height: 24px;
        image-rendering: pixelated;
      }
      .manual {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .manual a,
      .manual button {
        font: inherit;
        padding: 8px 12px;
        min-height: 44px;
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(128, 128, 128, 0.6);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        text-decoration: none;
      }
      .manual span {
        display: inline-flex;
        align-items: center;
        font-size: 12px;
        opacity: 0.75;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <h1>Crab 探针</h1>
    <p class="hint">每条结果同时打到 console（<code>CRAB-PROBE &lt;slug&gt; PASS|FAIL</code>），由 scripts/probe.sh 回读。</p>
    <img id="subresource" src="probe.png" alt="子资源探针图" />
    <table>
      <tbody id="results"></tbody>
    </table>
    <div id="env"></div>

    <h2>人工步骤（顺序见 docs/RUNBOOK.md）</h2>
    <!--
      八个人工按钮的清单来自 pro 的 M4：_blank、window.open、跨 origin、tel:、mailto:、未知 scheme、
      对话框（一个按钮依次弹三种）、定位；另加一个「跳到第二页」的同 origin 链接。
      地址一律取 ProbeContract 的四个越界目标（单测盯着逐字相等）。

      相机与麦克风刻意不给按钮：pro 明写「探针页只按定位这一条」，那两样只剩代码走查，
      M5 里按未验证写。给了按钮反而会让人以为它们被验过了
    -->
    <div class="manual">
      <a href="second.html">跳到第二页</a>
      <a href="https://out.crab.invalid/">跨 origin</a>
      <!-- 用户点的 _blank 与脚本发起的 window.open 是两条路，都落在 onCreateWindow 上，各要一行日志 -->
      <a href="second.html" target="_blank">_blank</a>
      <button type="button" id="btn-window-open">window.open</button>
      <a href="crabx://probe">未知 scheme</a>
      <a href="tel:+15555550100">tel:</a>
      <a href="mailto:probe@crab.invalid">mailto:</a>
      <button type="button" id="btn-dialogs">对话框</button>
      <button type="button" id="btn-geo">定位</button>
    </div>

    <h2>切后台观察（不进十六行）</h2>
    <!--
      「切后台媒体停播、计时器停」这条 pro 要求人工看一次，而看得见需要有东西在响、有东西在走：
      声音来自那段一秒的循环音，计时器来自下面这个每秒一跳的 tick（它同时打进 CRAB-ENV，
      所以「断没断」在 logcat 里也能回读，不必只靠眼睛）
    -->
    <p class="hint">先点「播放声音」，再按 Home 键待十秒回来：声音该停，tick 的时间戳该有一段断口。</p>
    <div class="manual">
      <button type="button" id="btn-tone">播放声音</button>
      <span id="tick">tick 0</span>
    </div>
    <audio id="tone" src="tone.wav" loop></audio>

    <script src="probe.js"></script>
  </body>
</html>
